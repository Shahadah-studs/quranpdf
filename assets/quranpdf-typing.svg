<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 180" role="img" aria-labelledby="title desc">
  <title id="title">QuranPDF animated typing banner</title>
  <desc id="desc">An infinite typing animation displaying QuranPDF.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0a0a0a"/>
      <stop offset="1" stop-color="#19150a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="typing-clip"><rect x="450" y="48" width="0" height="84"><animate attributeName="width" values="0;0;390;390;0;0" keyTimes="0;.08;.38;.70;.92;1" dur="4s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="900" height="180" rx="18" fill="url(#bg)" stroke="#d4af37" stroke-width="2"/>
  <text x="450" y="38" text-anchor="middle" fill="#aab5bb" font-family="Segoe UI, sans-serif" font-size="14" letter-spacing="4">READ • REFLECT • RECONNECT</text>
  <g filter="url(#glow)" clip-path="url(#typing-clip)">
    <text x="450" y="118" text-anchor="middle" fill="#d4af37" font-family="Consolas, monospace" font-size="58" font-weight="700">QuranPDF</text>
  </g>
  <rect x="450" y="48" width="4" height="78" fill="#f3e5ab">
    <animate attributeName="x" values="450;450;840;840;450;450" keyTimes="0;.08;.38;.70;.92;1" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;1;0;0;1" keyTimes="0;.08;.38;.70;.92;1" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
