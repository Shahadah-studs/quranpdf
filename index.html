<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuranPDF - Madani Mushaf</title>
    <style>
        /* Style de base */
        body {
            margin: 0;
            padding: 0;
            background-color: #0d0d0d;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        /* ========================================== */
        /*      VRAI ÉCRAN DE CHARGEMENT ACTIF        */
        /* ========================================== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background-color: #0a0a0a;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.6s ease-in-out, visibility 0.6s;
        }

        /* Classe ajoutée par JavaScript quand le PDF est prêt */
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid #222;
            border-top: 3px solid #d4af37; /* Or */
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loader-text {
            color: #ffffff;
            font-size: 1.2rem;
            letter-spacing: 1px;
            font-weight: 300;
            animation: pulseText 1.5s ease-in-out infinite;
        }

        /* ========================================== */
        /*            CONTENU PRINCIPAL               */
        /* ========================================== */
        header {
            width: 100%;
            background: linear-gradient(180deg, #161616 0%, #111111 100%);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            border-bottom: 1px solid #222;
        }

        .typing-container {
            display: inline-block;
        }

        h1 {
            margin: 0;
            font-size: 1.8rem;
            color: #d4af37;
            font-weight: 600;
            letter-spacing: 2px;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            border-right: 3px solid #d4af37;
        }

        /* Déclenché par JavaScript dès que le loader disparaît */
        .start-typing h1 {
            animation: 
                typing 2.5s steps(24) forwards,
                blink 0.75s step-end infinite;
        }

        .pdf-container {
            width: 95%;
            max-width: 1100px;
            height: calc(100vh - 120px);
            margin: 25px 0;
            background: #1a1a1a;
            border-radius: 12px;
            overflow: hidden;
            transform: translateY(30px);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.1, 1, 0.1, 1), opacity 1s;
        }

        /* Déclenché par JavaScript après l'écriture du titre */
        .show-pdf .pdf-container {
            transform: translateY(0);
            opacity: 1;
            animation: glowPulse 6s ease-in-out infinite alternate;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ========================================== */
        /*                ANIMATIONS                  */
        /* ========================================== */
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes typing {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes blink {
            from, to { border-color: transparent; }
            50% { border-color: #d4af37; }
        }

        @keyframes glowPulse {
            0% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 0 0px rgba(212, 175, 55, 0); }
            100% { box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.15); }
        }
    </style>
</head>
<body class="">

    <!-- VRAI écran de chargement -->
    <div id="loader" class="loading-screen">
        <div class="loader-spinner"></div>
        <div class="loader-text">QuranPDF Loading in progress...</div>
    </div>

    <header id="main-header">
        <div class="typing-container">
            <h1>QuranPDF - Madani Mushaf</h1>
        </div>
    </header>

    <div id="content-viewer" class="pdf-container">
        <!-- L'iframe charge le fichier en arrière-plan pendant le loader -->
        <iframe id="quran-iframe" src="https://dn760104.eu.archive.org/0/items/MadinahQuran/ar_Mushaf_AlMadinah_N_G.pdf"></iframe>
    </div>
<div style="color:orange; text-align:center; text-decoration:none; button::hover:color:blue;; ">
    <a href="wiki.html" >Wiki</a>
</div>
    <!-- Le Script qui gère la vraie synchronisation -->
    <script>
        const iframe = document.getElementById('quran-iframe');
        const loader = document.getElementById('loader');
        const body = document.body;

        // Écoute le moment exact où le PDF a fini de charger dans l'iframe
        iframe.addEventListener('load', () => {
            // Masque l'écran de chargement
            loader.classList.add('hidden');
            
            // Lance l'effet d'écriture du titre immédiatement après
            setTimeout(() => {
                body.classList.add('start-typing');
            }, 200);

            // Fait glisser le lecteur PDF une fois que le titre a fini de s'écrire (2.5 secondes plus tard)
            setTimeout(() => {
                body.classList.add('show-pdf');
            }, 2700);
        });
    </script>

</body>
</html>
