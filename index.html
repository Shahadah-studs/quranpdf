<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuranPDF</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }

        header {
            width: 100%;
            background-color: #111;
            color: #fff;
            text-align: center;
            padding: 15px 0;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            color: #d4af37;
        }

        .pdf-container {
            width: 95%;
            max-width: 1100px;
            height: calc(100vh - 100px);
            margin: 20px 0;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>QuranPDF - Madani Mushaf</h1>
    </header>

    <div class="pdf-container">
        <!-- Streaming a high-quality, authentic Mushaf directly into your website -->
        <iframe src="https://dn760104.eu.archive.org/0/items/MadinahQuran/ar_Mushaf_AlMadinah_N_G.pdf"></iframe>
    </div>

</body>
</html>
