<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuranPDF - Madani Mushaf</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }

        /* ========================================== */
        /*    NEON LOADING SCREEN - 25 SECONDS       */
        /* ========================================== */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 50%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            opacity: 1;
            transition: opacity 0.8s ease-in-out, visibility 0.8s;
            overflow: hidden;
        }

        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* Islamic Geometric Background Animation */
        .geometric-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0.15;
            overflow: hidden;
        }

        .geometric-pattern {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid #00ff88;
            transform: rotate(45deg);
            animation: geometricRotate 20s linear infinite;
        }

        .geometric-pattern:nth-child(1) {
            top: 10%;
            left: 10%;
            animation-delay: 0s;
            border-color: #00ff88;
        }

        .geometric-pattern:nth-child(2) {
            top: 60%;
            right: 15%;
            width: 150px;
            height: 150px;
            animation-delay: -5s;
            border-color: #ff00ff;
        }

        .geometric-pattern:nth-child(3) {
            bottom: 10%;
            left: 50%;
            width: 250px;
            height: 250px;
            animation-delay: -10s;
            border-color: #00ccff;
        }

        /* Islamic Star/Moon Elements */
        .islamic-element {
            position: absolute;
            font-size: 3rem;
            opacity: 0.2;
            animation: floatIslamicElement 6s ease-in-out infinite;
        }

        .islamic-element:nth-child(4) {
            top: 15%;
            left: 20%;
            animation-delay: 0s;
        }

        .islamic-element:nth-child(5) {
            top: 70%;
            right: 10%;
            animation-delay: 1s;
            font-size: 2.5rem;
        }

        .islamic-element:nth-child(6) {
            bottom: 20%;
            left: 5%;
            animation-delay: 2s;
            font-size: 2rem;
        }

        /* Neon Glowing Arabic Text */
        .arabic-text {
            font-size: 4rem;
            font-family: 'Traditional Arabic', 'Segoe UI', sans-serif;
            margin-bottom: 40px;
            font-weight: bold;
            letter-spacing: 3px;
            position: relative;
            z-index: 10;
            animation: neonGlow 2s ease-in-out infinite alternate;
        }

        .neon-cyan {
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff, 0 0 20px #00ffff, 0 0 40px #0088ff;
        }

        .neon-magenta {
            color: #ff00ff;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff, 0 0 40px #ff0088;
        }

        .neon-lime {
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88, 0 0 20px #00ff88, 0 0 40px #00ff00;
        }

        /* Neon Progress Container */
        .progress-container {
            width: 300px;
            height: 8px;
            background-color: rgba(0, 0, 0, 0.5);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.3), inset 0 0 10px rgba(0, 255, 136, 0.1);
            border: 2px solid rgba(0, 255, 136, 0.3);
            position: relative;
            z-index: 10;
        }

        /* Neon Progress Bar with Multiple Colors */
        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #00ff88 0%, #00ffff 25%, #ff00ff 50%, #00ffff 75%, #00ff88 100%);
            border-radius: 10px;
            box-shadow: 0 0 20px #00ff88, 0 0 10px #00ffff;
            background-size: 200% 100%;
            animation: neonFill 25s cubic-bezier(0.1, 0.8, 0.1, 1) forwards;
        }

        .loader-text {
            color: #00ffff;
            font-size: 0.95rem;
            margin-top: 25px;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 600;
            text-shadow: 0 0 10px #00ffff;
            position: relative;
            z-index: 10;
            animation: textBlink 1s ease-in-out infinite;
        }

        /* Loading percentage counter */
        .loader-percent {
            color: #ff00ff;
            font-size: 1.2rem;
            margin-top: 12px;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
            position: relative;
            z-index: 10;
        }

        /* ========================================== */
        /*         NEON HEADER DESIGN                 */
        /* ========================================== */
        header {
            width: 100%;
            background: linear-gradient(180deg, rgba(10, 10, 10, 0.95) 0%, rgba(20, 10, 35, 0.9) 100%);
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2), inset 0 -1px 0 rgba(0, 255, 136, 0.1);
            border-bottom: 2px solid rgba(0, 255, 136, 0.3);
            backdrop-filter: blur(10px);
        }

        .typing-container {
            display: inline-block;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            background: linear-gradient(90deg, #00ffff 0%, #00ff88 25%, #ff00ff 50%, #00ff88 75%, #00ffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
            letter-spacing: 2px;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }

        .start-typing h1 {
            animation: 
                neonTyping 3s steps(28) forwards,
                neonBlink 0.75s step-end infinite;
        }

        /* ========================================== */
        /*      NEON PDF CONTAINER DESIGN            */
        /* ========================================== */
        .pdf-container {
            width: 95%;
            max-width: 1200px;
            height: calc(100vh - 200px);
            margin: 15px auto;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0f2e 100%);
            border-radius: 15px;
            overflow: hidden;
            transform: translateY(50px);
            opacity: 0;
            transition: transform 1s cubic-bezier(0.1, 1, 0.1, 1), opacity 1s;
            border: 2px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 255, 136, 0.05);
        }

        .show-pdf .pdf-container {
            transform: translateY(0);
            opacity: 1;
            box-shadow: 0 0 60px rgba(0, 255, 136, 0.25), inset 0 0 30px rgba(0, 255, 136, 0.1);
            animation: neonPulse 4s ease-in-out infinite alternate;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            background: #0a0a0a;
        }

        /* ========================================== */
        /*         NEON FOOTER/NAVIGATION            */
        /* ========================================== */
        .footer-nav {
            color: #00ff88;
            text-align: center;
            text-decoration: none;
            padding: 10px 20px;
            margin-top: 10px;
            border: 2px solid #00ff88;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            text-shadow: 0 0 10px #00ff88;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.3);
        }

        .footer-nav:hover {
            background: rgba(0, 255, 136, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.6);
            text-shadow: 0 0 20px #00ff88;
        }

        .footer-nav a {
            color: #00ff88;
            text-decoration: none;
            font-weight: 600;
        }

        /* ========================================== */
        /*         NEON AUDIO PLAYER BAR             */
        /* ========================================== */
        .audio-player-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: linear-gradient(0deg, rgba(10, 10, 10, 0.95) 0%, rgba(20, 10, 35, 0.9) 100%);
            border-top: 2px solid rgba(0, 255, 136, 0.3);
            padding: 15px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 -10px 40px rgba(0, 255, 136, 0.2);
            z-index: 100;
            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.1, 1, 0.1, 1);
            backdrop-filter: blur(10px);
        }

        .show-pdf .audio-player-container {
            transform: translateY(0);
        }

        .audio-title {
            color: #00ffff;
            font-size: 0.9rem;
            margin-bottom: 8px;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #00ffff;
            font-weight: 600;
        }

        .audio-title span {
            color: #ff00ff;
            font-weight: bold;
            text-shadow: 0 0 10px #ff00ff;
        }

        audio {
            width: 90%;
            max-width: 800px;
            height: 36px;
            outline: none;
            border-radius: 10px;
        }

        audio::-webkit-media-controls-panel {
            background-color: rgba(30, 30, 30, 0.7);
        }
        audio::-webkit-media-controls-current-time-display,
        audio::-webkit-media-controls-time-remaining-display {
            color: #00ff88;
        }

        /* ========================================== */
        /*         KEYFRAME ANIMATIONS               */
        /* ========================================== */
        @keyframes neonFill {
            0% { 
                width: 0%; 
                background-position: 0% center;
            }
            100% { 
                width: 100%; 
                background-position: 100% center;
            }
        }

        @keyframes neonGlow {
            0% { 
                text-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
                opacity: 0.7;
            }
            100% { 
                text-shadow: 0 0 20px currentColor, 0 0 40px currentColor, 0 0 60px currentColor;
                opacity: 1;
            }
        }

        @keyframes neonTyping {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes neonBlink {
            from, to { border-color: transparent; }
            50% { border-color: #00ffff; }
        }

        @keyframes neonPulse {
            0% { 
                box-shadow: 0 0 40px rgba(0, 255, 136, 0.15), inset 0 0 20px rgba(0, 255, 136, 0.05);
            }
            100% { 
                box-shadow: 0 0 80px rgba(0, 255, 136, 0.35), inset 0 0 40px rgba(0, 255, 136, 0.15);
            }
        }

        @keyframes textBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        @keyframes geometricRotate {
            from { transform: rotate(45deg); }
            to { transform: rotate(405deg); }
        }

        @keyframes floatIslamicElement {
            0%, 100% { 
                transform: translateY(0px) translateX(0px);
            }
            25% { 
                transform: translateY(-20px) translateX(10px);
            }
            50% { 
                transform: translateY(-40px) translateX(-10px);
            }
            75% { 
                transform: translateY(-20px) translateX(10px);
            }
        }
    </style>
</head>
<body>

    <!-- NEON Loading Screen with Islamic Animations -->
    <div id="loader" class="loading-screen">
        <!-- Islamic Geometric Background -->
        <div class="geometric-bg">
            <div class="geometric-pattern"></div>
            <div class="geometric-pattern"></div>
            <div class="geometric-pattern"></div>
            <div class="islamic-element">☪</div>
            <div class="islamic-element">🌙</div>
            <div class="islamic-element">✡</div>
        </div>

        <!-- Neon Neon Loading Content -->
        <div class="arabic-text neon-cyan">ق</div>
        <div class="arabic-text neon-magenta">ر</div>
        <div class="arabic-text neon-lime">آ</div>
        <div class="arabic-text neon-cyan">ن</div>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
        
        <div class="loader-text">Loading Quranic Experience</div>
        <div class="loader-percent">
            <span id="percent-value">0</span>%
        </div>
    </div>

    <!-- Neon Header -->
    <header id="main-header">
        <div class="typing-container">
            <h1>QuranPDF - Madani Mushaf</h1>
        </div>
    </header>

    <!-- PDF Viewer Container -->
    <div id="content-viewer" class="pdf-container">
        <iframe id="quran-iframe" src="https://dn760104.eu.archive.org/0/items/MadinahQuran/ar_Mushaf_AlMadinah_N_G.pdf"></iframe>
    </div>

    <!-- Neon Navigation Footer -->
    <div style="text-align: center; margin-bottom: 20px;">
        <button class="footer-nav">
            <a href="wiki.html">Wiki</a>
        </button>
    </div>

    <!-- Audio Player Container -->
    <div class="audio-player-container">
        <div class="audio-title">
            Quranic <span>Audio</span>
        </div>
        <audio controls></audio>
    </div>

    <!-- Script Engine -->
    <script>
        const iframe = document.getElementById('quran-iframe');
        const loader = document.getElementById('loader');
        const body = document.body;
        const progressBar = document.querySelector('.progress-bar');
        const percentValue = document.getElementById('percent-value');

        // Simulate 25-second loading with percentage counter
        let currentPercent = 0;
        const loadingInterval = setInterval(() => {
            if (currentPercent < 95) {
                currentPercent += Math.random() * 4;
                if (currentPercent > 95) currentPercent = 95;
                percentValue.textContent = Math.floor(currentPercent);
            }
        }, 100);

        // Handle iframe load completion
        iframe.addEventListener('load', () => {
            clearInterval(loadingInterval);
            currentPercent = 100;
            percentValue.textContent = '100';
            
            // Set progress bar to full
            progressBar.style.animation = 'none';
            progressBar.style.width = '100%';

            // Hide loading screen after 25 seconds or when loaded
            setTimeout(() => {
                loader.classList.add('hidden');
                
                // Trigger typing animation for header
                setTimeout(() => {
                    body.classList.add('start-typing');
                }, 300);

                // Show PDF container
                setTimeout(() => {
                    body.classList.add('show-pdf');
                }, 3000);

            }, 500);
        });

        // Force 25-second loading screen minimum
        setTimeout(() => {
            if (!loader.classList.contains('hidden')) {
                clearInterval(loadingInterval);
                currentPercent = 100;
                percentValue.textContent = '100';
                progressBar.style.animation = 'none';
                progressBar.style.width = '100%';
                
                loader.classList.add('hidden');
                
                setTimeout(() => {
                    body.classList.add('start-typing');
                }, 300);

                setTimeout(() => {
                    body.classList.add('show-pdf');
                }, 3000);
            }
        }, 25000);
    </script>

</body>
</html>
