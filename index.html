<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuranPDF - Madani Mushaf</title>
    <style>
        :root {
            --bg-1: #05070d;
            --bg-2: #0f172a;
            --bg-3: #1d2033;
            --ink: #edf6ff;
            --cyan: #68f1ff;
            --teal: #3be7c4;
            --green: #8af7a6;
            --purple: #d592ff;
            --gold: #f5d78b;
            --amber: #f7b267;
            --glass: rgba(12, 16, 24, 0.72);
            --border: rgba(104, 241, 255, 0.28);
            --shadow-cyan: rgba(104, 241, 255, 0.45);
            --shadow-green: rgba(59, 231, 196, 0.35);
            --shadow-purple: rgba(213, 146, 255, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: radial-gradient(circle at top, #101a2e 0%, var(--bg-1) 35%, #060b12 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: var(--ink);
        }

        body {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.02), rgba(255,255,255,0.01)),
                repeating-linear-gradient(
                    90deg,
                    transparent 0,
                    transparent 60px,
                    rgba(104, 241, 255, 0.03) 61px,
                    transparent 62px
                );
            pointer-events: none;
            z-index: 0;
        }

        body::after {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 50% 20%, rgba(104, 241, 255, 0.12), transparent 30%);
            pointer-events: none;
            z-index: 0;
        }

        .loader {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(4, 8, 14, 0.96), rgba(15, 19, 31, 0.96), rgba(9, 4, 17, 0.96));
            transition: opacity 0.9s ease, visibility 0.9s ease;
            overflow: hidden;
        }

        .loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader-bg {
            position: absolute;
            inset: 0;
            overflow: hidden;
            opacity: 0.9;
        }

        .mosque-glow {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 50% 30%, rgba(104, 241, 255, 0.12), transparent 20%),
                radial-gradient(circle at 50% 80%, rgba(59, 231, 196, 0.14), transparent 25%),
                linear-gradient(180deg, rgba(104, 241, 255, 0.04), transparent 30%, rgba(59, 231, 196, 0.06));
        }

        .mosque-pattern {
            position: absolute;
            left: 50%;
            top: 50%;
            width: min(65vw, 700px);
            height: min(65vw, 700px);
            transform: translate(-50%, -50%);
            opacity: 0.13;
            background-image:
                linear-gradient(rgba(104, 241, 255, 0.35) 1px, transparent 1px),
                linear-gradient(90deg, rgba(104, 241, 255, 0.35) 1px, transparent 1px),
                radial-gradient(circle at center, rgba(59, 231, 196, 0.45) 0, rgba(59, 231, 196, 0.08) 38%, transparent 55%);
            background-size: 42px 42px, 42px 42px, 100% 100%;
            mask-image: radial-gradient(circle at center, black 30%, transparent 75%);
            animation: patternFloat 18s ease-in-out infinite alternate;
        }

        .mosque-silhouette {
            position: absolute;
            bottom: -10px;
            left: 50%;
            width: min(72vw, 980px);
            height: 220px;
            transform: translateX(-50%);
            opacity: 0.38;
            filter: drop-shadow(0 0 18px rgba(104, 241, 255, 0.18));
            background: linear-gradient(180deg, rgba(15, 22, 31, 0.2), rgba(15, 22, 31, 0.8));
            clip-path: polygon(9% 100%, 9% 52%, 15% 52%, 15% 38%, 28% 38%, 28% 52%, 34% 52%, 34% 28%, 40% 28%, 40% 52%, 48% 52%, 48% 18%, 52% 18%, 52% 52%, 60% 52%, 60% 28%, 66% 28%, 66% 52%, 72% 52%, 72% 38%, 85% 38%, 85% 52%, 91% 52%, 91% 100%);
            animation: silhouettePulse 10s ease-in-out infinite alternate;
        }

        .mosque-silhouette::before,
        .mosque-silhouette::after {
            content: "";
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(180deg, rgba(104, 241, 255, 0.12), rgba(59, 231, 196, 0.04));
            clip-path: polygon(0 100%, 0 56%, 100% 56%, 100% 100%);
        }

        .mosque-silhouette::after {
            background: linear-gradient(180deg, rgba(104, 241, 255, 0.05), rgba(104, 241, 255, 0.05));
            clip-path: polygon(0 100%, 0 68%, 100% 68%, 100% 100%);
            opacity: 0.7;
        }

        .moon {
            position: absolute;
            width: 160px;
            height: 160px;
            border-radius: 50%;
            right: 18%;
            top: 16%;
            background: radial-gradient(circle at 35% 35%, #fffef5 0%, #f0f2ff 20%, #dfe9ff 35%, rgba(223, 233, 255, 0.35) 60%, transparent 100%);
            box-shadow: 0 0 35px rgba(255,255,255,0.4), 0 0 55px rgba(104, 241, 255, 0.35);
            opacity: 0.85;
            animation: moonPulse 7s ease-in-out infinite;
        }

        .star {
            position: absolute;
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(255,255,255,0.9), 0 0 18px rgba(104, 241, 255, 0.7);
            animation: starTwinkle 3s ease-in-out infinite alternate;
        }

        .star:nth-child(1) { left: 18%; top: 24%; animation-delay: 0.2s; }
        .star:nth-child(2) { left: 30%; top: 18%; animation-delay: 1.2s; }
        .star:nth-child(3) { right: 26%; top: 28%; animation-delay: 0.6s; }
        .star:nth-child(4) { right: 42%; top: 18%; animation-delay: 1.8s; }
        .star:nth-child(5) { left: 58%; bottom: 20%; animation-delay: 0.9s; }
        .star:nth-child(6) { right: 18%; bottom: 22%; animation-delay: 1.4s; }

        .loader-card {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            text-align: center;
        }

        .brand-mark {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            font-family: 'Traditional Arabic', 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: clamp(3rem, 6vw, 5.5rem);
            letter-spacing: 3px;
            line-height: 1;
            filter: drop-shadow(0 0 25px rgba(104, 241, 255, 0.65));
        }

        .brand-mark span {
            display: inline-block;
            background: linear-gradient(90deg, var(--cyan), var(--gold), var(--purple), var(--teal));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: calligraphyGlow 2.5s ease-in-out infinite alternate;
        }

        .brand-subtitle {
            font-size: 0.9rem;
            letter-spacing: 0.38rem;
            text-transform: uppercase;
            color: rgba(237, 246, 255, 0.8);
            text-shadow: 0 0 12px rgba(104, 241, 255, 0.4);
        }

        .progress-wrap {
            width: min(82vw, 420px);
            display: flex;
            flex-direction: column;
            gap: 14px;
            align-items: center;
        }

        .progress-bar-rail {
            position: relative;
            width: 100%;
            height: 12px;
            border-radius: 999px;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(104, 241, 255, 0.2);
            box-shadow: inset 0 0 20px rgba(0,0,0,0.45), 0 0 20px rgba(104, 241, 255, 0.1);
            overflow: hidden;
        }

        .progress-bar-fill {
            position: absolute;
            inset: 0 auto 0 0;
            width: 0%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--green), var(--cyan), var(--purple), var(--gold), var(--teal));
            box-shadow: 0 0 18px rgba(104, 241, 255, 0.7), 0 0 28px rgba(59, 231, 196, 0.6);
            background-size: 220% 100%;
            animation: progressGlow 25s linear forwards;
        }

        .loading-status {
            display: flex;
            justify-content: space-between;
            width: 100%;
            color: rgba(237, 246, 255, 0.82);
            font-size: 0.82rem;
            letter-spacing: 0.18rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .loading-status .percent {
            color: var(--gold);
            text-shadow: 0 0 12px rgba(245, 215, 139, 0.6);
        }

        .loading-status .status-text {
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(104, 241, 255, 0.45);
        }

        .header {
            position: relative;
            z-index: 2;
            width: 100%;
            padding: 22px 0 18px;
            background: linear-gradient(180deg, rgba(8, 13, 21, 0.92), rgba(18, 20, 31, 0.82));
            border-bottom: 1px solid rgba(104, 241, 255, 0.16);
            box-shadow: 0 10px 35px rgba(11, 16, 25, 0.3), inset 0 -1px 0 rgba(104, 241, 255, 0.1);
            backdrop-filter: blur(10px);
        }

        .nav-bar {
            width: min(1200px, 95%);
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .title-box {
            display: inline-block;
            padding: 12px 18px;
            border: 1px solid rgba(104, 241, 255, 0.18);
            border-radius: 16px;
            background: rgba(10, 18, 29, 0.22);
            box-shadow: 0 0 18px rgba(104, 241, 255, 0.12);
        }

        h1 {
            font-size: clamp(1.2rem, 2vw, 2rem);
            font-weight: 700;
            letter-spacing: 0.18rem;
            white-space: nowrap;
            overflow: hidden;
            width: 0;
            display: inline-block;
            background: linear-gradient(90deg, var(--cyan), var(--teal), var(--purple), var(--gold));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 0 18px rgba(104, 241, 255, 0.18);
        }

        .start-typing h1 {
            animation: typingReveal 2.8s steps(28, end) forwards, caretBlink 0.8s step-end infinite;
        }

        .verse-banner {
            position: relative;
            z-index: 2;
            width: min(1100px, 92%);
            margin: 16px auto 0;
            padding: 16px 24px;
            border-radius: 18px;
            border: 1px solid rgba(104, 241, 255, 0.16);
            background: linear-gradient(135deg, rgba(59, 231, 196, 0.08), rgba(104, 241, 255, 0.12), rgba(213, 146, 255, 0.08));
            box-shadow: 0 0 22px rgba(104, 241, 255, 0.08), inset 0 0 18px rgba(59, 231, 196, 0.04);
            text-align: center;
            backdrop-filter: blur(8px);
        }

        .verse-banner .verse-quote {
            font-size: clamp(0.7rem, 1.5vw, 1rem);
            letter-spacing: 0.15rem;
            text-transform: uppercase;
            color: var(--gold);
            text-shadow: 0 0 12px rgba(245, 215, 139, 0.55);
            opacity: 0.95;
        }

        .verse-banner .verse-text {
            margin-top: 8px;
            font-size: clamp(0.9rem, 2vw, 1.35rem);
            color: var(--ink);
            letter-spacing: 0.08rem;
            text-shadow: 0 0 12px rgba(104, 241, 255, 0.2);
        }

        .viewer {
            position: relative;
            z-index: 2;
            width: min(1200px, 95%);
            height: calc(100vh - 220px);
            margin: 18px auto 22px;
            background: linear-gradient(180deg, rgba(12, 14, 16, 0.9), rgba(18, 16, 30, 0.9));
            border: 1px solid rgba(104, 241, 255, 0.18);
            border-radius: 22px;
            overflow: hidden;
            opacity: 0;
            transform: translateY(48px) scale(0.985);
            box-shadow: 0 0 45px rgba(104, 241, 255, 0.08), inset 0 0 30px rgba(59, 231, 196, 0.04);
            transition: opacity 1s ease, transform 1s cubic-bezier(0.2, 0.9, 0.2, 1);
        }

        .show-pdf .viewer {
            opacity: 1;
            transform: translateY(0) scale(1);
            animation: viewerGlow 4s ease-in-out infinite alternate;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
            background: #050b12;
        }

        .wiki-link-wrap {
            position: relative;
            z-index: 2;
            margin-bottom: 14px;
        }

        .wiki-button {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 999px;
            border: 1px solid rgba(59, 231, 196, 0.45);
            background: linear-gradient(135deg, rgba(59, 231, 196, 0.12), rgba(104, 241, 255, 0.08));
            box-shadow: 0 0 18px rgba(59, 231, 196, 0.14);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .wiki-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 28px rgba(59, 231, 196, 0.28);
            border-color: rgba(104, 241, 255, 0.72);
        }

        .wiki-button a {
            color: var(--teal);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.18rem;
            font-size: 0.75rem;
            font-weight: 700;
            text-shadow: 0 0 12px rgba(59, 231, 196, 0.5);
        }

        .audio-player {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            z-index: 10;
            transform: translateY(100%);
            transition: transform 0.7s ease;
            background: linear-gradient(180deg, rgba(10, 12, 19, 0.78), rgba(25, 18, 35, 0.9));
            border-top: 1px solid rgba(104, 241, 255, 0.15);
            backdrop-filter: blur(12px);
            box-shadow: 0 -12px 24px rgba(0,0,0,0.2);
            padding: 16px 0 18px;
        }

        .show-pdf .audio-player {
            transform: translateY(0);
        }

        .audio-box {
            width: min(820px, 90%);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .audio-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.2rem;
            color: rgba(237, 246, 255, 0.75);
        }

        .audio-label span {
            color: var(--cyan);
            text-shadow: 0 0 10px rgba(104, 241, 255, 0.7);
        }

        audio {
            width: 100%;
            height: 36px;
            border-radius: 999px;
            filter: drop-shadow(0 0 10px rgba(104, 241, 255, 0.14));
        }

        @keyframes progressGlow {
            0% { width: 0%; background-position: 0% center; }
            100% { width: 100%; background-position: 200% center; }
        }

        @keyframes calligraphyGlow {
            0% {
                filter: drop-shadow(0 0 10px rgba(104, 241, 255, 0.5));
                opacity: 0.8;
            }
            100% {
                filter: drop-shadow(0 0 24px rgba(104, 241, 255, 0.9));
                opacity: 1;
            }
        }

        @keyframes patternFloat {
            0% { transform: translate(-50%, -50%) scale(0.96) rotate(0deg); }
            100% { transform: translate(-50%, -50%) scale(1.08) rotate(12deg); }
        }

        @keyframes silhouettePulse {
            0% { opacity: 0.24; transform: translateX(-50%) scaleY(0.96); }
            100% { opacity: 0.42; transform: translateX(-50%) scaleY(1.04); }
        }

        @keyframes moonPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(255,255,255,0.35), 0 0 55px rgba(104, 241, 255, 0.25); }
            50% { transform: scale(1.08); box-shadow: 0 0 38px rgba(255,255,255,0.5), 0 0 68px rgba(104, 241, 255, 0.4); }
        }

        @keyframes starTwinkle {
            0% { opacity: 0.3; transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1.4); }
        }

        @keyframes typingReveal {
            from { width: 0; }
            to { width: 100%; }
        }

        @keyframes caretBlink {
            from, to { border-right-color: transparent; }
            50% { border-right-color: rgba(104, 241, 255, 0.8); }
        }

        @keyframes viewerGlow {
            0% { box-shadow: 0 0 28px rgba(104, 241, 255, 0.1), inset 0 0 25px rgba(59, 231, 196, 0.05); }
            100% { box-shadow: 0 0 42px rgba(104, 241, 255, 0.2), inset 0 0 30px rgba(59, 231, 196, 0.12); }
        }

        @media (max-width: 700px) {
            .header {
                padding: 18px 0;
            }

            .title-box {
                padding: 10px 14px;
                border-radius: 12px;
            }

            h1 {
                letter-spacing: 0.08rem;
            }

            .viewer {
                height: calc(100vh - 240px);
            }

            .brand-mark {
                gap: 8px;
            }

            .loading-status {
                font-size: 0.68rem;
                letter-spacing: 0.12rem;
            }

            .verse-banner {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div id="loader" class="loader">
        <div class="loader-bg">
            <div class="mosque-glow"></div>
            <div class="mosque-pattern"></div>
            <div class="mosque-silhouette"></div>
            <div class="moon"></div>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
            <span class="star"></span>
        </div>

        <div class="loader-card">
            <div class="brand-mark" aria-label="Quran logo">
                <span>القرآن</span>
                
            </div>
            <div class="brand-subtitle">Madani Mushaf</div>

            <div class="progress-wrap">
                <div class="progress-bar-rail">
                    <div class="progress-bar-fill" id="progress-fill"></div>
                </div>
                <div class="loading-status">
                    <span class="status-text">Preparing</span>
                    <span class="percent" id="percent">0%</span>
                </div>
            </div>
        </div>
    </div>

    <header class="header" id="main-header">
        <div class="nav-bar">
            <div class="title-box">
                <h1>QuranPDF - Madani Mushaf</h1>
            </div>
        </div>
    </header>

    

    <div id="content-viewer" class="viewer">
        <iframe id="quran-iframe" src="https://dn760104.eu.archive.org/0/items/MadinahQuran/ar_Mushaf_AlMadinah_N_G.pdf" title="Quran PDF Viewer"></iframe>
    </div>

    <div class="wiki-link-wrap">
        <div class="wiki-button"><a href="wiki.html">Wiki</a></div>
    </div>

    <div class="audio-player">
        <div class="audio-box">
            <div class="audio-label">Quranic <span>Audio</span></div>
            <audio controls></audio>
        </div>
    </div>

    <script>
        const iframe = document.getElementById('quran-iframe');
        const loader = document.getElementById('loader');
        const body = document.body;
        const fill = document.getElementById('progress-fill');
        const percent = document.getElementById('percent');

        let current = 0;
        const update = () => {
            current = Math.min(current + (Math.random() * 1.8 + 0.9), 99);
            fill.style.width = current + '%';
            percent.textContent = Math.floor(current) + '%';
        };

        const timer = setInterval(update, 220);

        iframe.addEventListener('load', () => {
            clearInterval(timer);
            fill.style.width = '100%';
            percent.textContent = '100%';

            setTimeout(() => {
                loader.classList.add('hidden');
            }, 500);

            setTimeout(() => {
                body.classList.add('start-typing');
            }, 300);

            setTimeout(() => {
                body.classList.add('show-pdf');
            }, 2200);
        });

        setTimeout(() => {
            if (!loader.classList.contains('hidden')) {
                clearInterval(timer);
                fill.style.width = '100%';
                percent.textContent = '100%';
                loader.classList.add('hidden');
                setTimeout(() => body.classList.add('start-typing'), 250);
                setTimeout(() => body.classList.add('show-pdf'), 2200);
            }
        }, 25000);
    </script>
</body>
</html>
